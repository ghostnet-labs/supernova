# Scripts below live in the setup checkout. The shell exports SETUP_DIR; when
# tmux starts without it, derive it from the ~/.tmux.conf link.
if-shell '[ -z "$SETUP_DIR" ] && [ -L "$HOME/.tmux.conf" ]' {
    run-shell 'tmux set-environment -g SETUP_DIR "$(cd "$(dirname "$(readlink "$HOME/.tmux.conf")")/.." && pwd)"'
}

# Set the prefix to Ctrl + a instead of Ctrl + b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Last saved environment is automatically restored when tmux is started
set -g @continuum-restore 'on'

# Move window left/right with Ctrl-Shift-Left/Right
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# Enable mouse support for resizing and switching panes
set -g mouse on

# Focus-main layout: one large working pane on the left and a compact stack
# on the right. Toggle it per window with Ctrl-a then Shift-F.
set -w -g main-pane-width 84%
set -w -g other-pane-width 20%

# When focus-main is enabled, any pane selected by mouse, arrow key, or
# Ctrl-a o is promoted into the large top-left slot. The indexed hook keeps
# reloads idempotent and leaves other after-select-pane hooks alone.
set-hook -g after-select-pane[99] 'if-shell -F "#{&&:#{@focus_main},#{!:#{&&:#{pane_at_top},#{pane_at_left}}}}" "swap-pane -d -s : -t \"{top-left}\" \; select-pane -t \"{top-left}\" \; select-layout main-vertical"'

# Toggle focus-main for only the current window, keeping the current pane
# as the large pane when the mode is enabled.
bind F if-shell -F '#{@focus_main}' 'set -w @focus_main 0; display-message "Focus-main layout: off"' 'set -w @focus_main 1; select-layout main-vertical; if-shell -F "#{&&:#{pane_at_top},#{pane_at_left}}" "" "swap-pane -d -s : -t \"{top-left}\"; select-pane -t \"{top-left}\"; select-layout main-vertical"; display-message "Focus-main layout: on"'

# Improve pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation with arrow keys
bind -r UP select-pane -U
bind -r DOWN select-pane -D
bind -r LEFT select-pane -L
bind -r RIGHT select-pane -R

# Resize panes with Shift+arrow keys
bind -r S-UP resize-pane -U 5
bind -r S-DOWN resize-pane -D 5
bind -r S-LEFT resize-pane -L 5
bind -r S-RIGHT resize-pane -R 5

# Use < and > to move between windows
bind < previous-window
bind > next-window

# Smooth Scrolling
set -g history-limit 100000
bind -T copy-mode-vi WheelUpPane send -N 1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N 1 -X scroll-down

# Allow window renaming using Ctrl + a then r
bind r command-prompt "rename-window %%"

# Rename the current pane with Ctrl + a then p. A blank name falls back to
# displaying the active command in its border label.
bind p command-prompt -p "rename-pane" "set-option -p @pane_label '%%'"

# Tokyo Night status bar appearance
set -g status-style 'bg=#1f2335,fg=#c0caf5'
set -g message-style 'bg=#1f2335,fg=#7aa2f7'
set -g mode-style 'bg=#bb9af7,fg=#1a1b26'
set -g popup-style 'bg=#1f2335,fg=#c0caf5'
set -g popup-border-style 'fg=#7aa2f7'
set -g menu-style 'bg=#1f2335,fg=#c0caf5'
set -g menu-selected-style 'bg=#7aa2f7,fg=#1a1b26'
set -g menu-border-style 'fg=#7aa2f7'
set -g status-interval 10
set -g status 2

# Left-align windows, keep the active one visible, and mark tabs clipped by overflow.
set -g status-format[0] '#[align=left list=on]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index}]#{E:window-status-format}#[norange list=on]  ,#[range=window|#{window_index} list=focus]#{E:window-status-current-format}#[norange list=on]  }#[nolist align=right]#[fg=#7aa2f7]#[range=user|prev][←]#[norange] #[range=user|next][→]#[norange] #[range=user|new][+]#[norange] #[range=user|split][↕]#[norange] #[range=user|vsplit][↔]#[norange]'

# Put clickable Git state on the left and reload plus the session on the right
# of the second row. User ranges keep the normal window mouse bindings intact.
set -g status-format[1] '#[align=left]#[fg=#565f89]#[range=user|git]#($SETUP_DIR/dotfiles/.bin/tmux-git-status #{q:pane_current_path} 2>/dev/null)#[norange]#[align=right]#{?@setup_dashboard,#[range=user|dashboard]#{@setup_dashboard}#[norange] | ,}#[range=user|reload]reload#[norange] | #[range=user|session]#S#[norange]'

# Shared commands power both left-click actions and the right-click menu.
set -s command-alias[100] 'status-git=display-popup -E -d "#{pane_current_path}" -h 80% -w 90% -T "Git status" "$SETUP_DIR/dotfiles/.bin/tmux-git-popup"'
set -s command-alias[101] 'status-new-window=new-window -c "#{pane_current_path}"'
set -s command-alias[102] 'status-split=split-window -v -c "#{pane_current_path}"'
set -s command-alias[103] 'status-reload=source-file "$HOME/.tmux.conf"; display-message "Tmux config reloaded!"'
set -s command-alias[104] 'status-session=choose-tree -s'
set -s command-alias[105] 'status-menu=display-menu -T "#[align=centre]Status actions" -x M -y S "#{?@setup_dashboard,,-}Dashboard" d status-dashboard "Git status" g status-git "Navigator" f status-navigate "Projects" p status-project "" "New window" n status-new-window "Split top/bottom" s status-split "Split left/right" v status-vsplit "Toggle zoom" z "resize-pane -Z" "" "Choose session" c status-session "Reload config" r status-reload'
set -s command-alias[106] 'status-window-menu=display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } "" Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } "" "New After" w { new-window -a } "New At End" W { new-window }'
set -s command-alias[107] 'status-vsplit=split-window -h -c "#{pane_current_path}"'
set -s command-alias[109] 'status-navigate=display-popup -E -d "#{pane_current_path}" -h 85% -w 90% -T "Tmux navigator" "$SETUP_DIR/dotfiles/.bin/tmux-fzf navigate"'
set -s command-alias[110] 'status-project=display-popup -E -d "#{pane_current_path}" -h 85% -w 90% -T "Project launcher" "$SETUP_DIR/dotfiles/.bin/tmux-fzf projects"'

# Fuzzy navigation for existing panes and local Git projects.
bind g status-navigate
bind G status-project

# Left-click each control to run it. Right-click any control for the full menu.
bind -n MouseDown1Status \
    if-shell -F '#{==:#{mouse_status_range},dashboard}' 'status-dashboard' '' \; \
    if-shell -F '#{==:#{mouse_status_range},git}' 'status-git' '' \; \
    if-shell -F '#{==:#{mouse_status_range},prev}' 'previous-window' '' \; \
    if-shell -F '#{==:#{mouse_status_range},next}' 'next-window' '' \; \
    if-shell -F '#{==:#{mouse_status_range},new}' 'status-new-window' '' \; \
    if-shell -F '#{==:#{mouse_status_range},split}' 'status-split' '' \; \
    if-shell -F '#{==:#{mouse_status_range},vsplit}' 'status-vsplit' '' \; \
    if-shell -F '#{==:#{mouse_status_range},reload}' 'status-reload' '' \; \
    if-shell -F '#{==:#{mouse_status_range},session}' 'status-session' '' \; \
    if-shell -F '#{==:#{mouse_status_range},window}' 'switch-client -t =' ''
bind -n MouseDown3Status if-shell -F '#{==:#{mouse_status_range},window}' 'status-window-menu' 'status-menu'
# Touchpad momentum is ambiguous in terminals; use one-step controls instead.
unbind -nq WheelUpStatus
unbind -nq WheelDownStatus

# Style for inactive panes
set -g window-style 'bg=#16161e,fg=#737aa2'

# Style for active pane
set -g window-active-style 'bg=#1a1b26,fg=#c0caf5'


# Render native Codex activity and elapsed state time in window tabs.
# Parsed when run, after the SETUP_DIR fallback at the top has been applied.
if-shell -F 1 'source-file "$SETUP_DIR/dotfiles/.tmux.native-activity.conf"'

# Change window indexing from 0 to 1
set -g base-index 1

# Keep window prefixes contiguous after closing a window
set -g renumber-windows on

# Use vim keybindings for copy mode
setw -g mode-keys vi

# Enable 256 color support
set -g default-terminal "xterm-256color"
# Preserve OSC 8 links and styled underline colours without duplicating reloads.
set -s terminal-features[99] "xterm-256color:hyperlinks:usstyle"
# Let visible panes pass wrapped terminal features such as Codex OSC 9 notifications.
set -wg allow-passthrough on

# Kill Pane
bind x confirm "kill-pane"

# Kill Window
bind X confirm "kill-window"

# Smooth pane switching
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# Show a compact pane number and its custom label above each pane, falling
# back to the active command until the pane has been named.
setw -g pane-border-status top
setw -g pane-border-format ' #[fg=#bb9af7]#P #{?@pane_label,#{@pane_label},#{pane_current_command}}#{?#{&&:#{m/r:^codex,#{pane_current_command}},#{pane_title}}, #{E:@codex_native_state},}#[default] '


# Reload configuration with Ctrl + a then R
bind R source-file $HOME/.tmux.conf \; display-message "Tmux config reloaded!"

# New windows/panes inherit current path
bind c new-window -c "#{pane_current_path}"

# Use Homebrew zsh as default shell (cross-platform)
if-shell "test -x /opt/homebrew/bin/zsh" "set -g default-shell /opt/homebrew/bin/zsh"
if-shell "test -x /home/linuxbrew/.linuxbrew/bin/zsh" "set -g default-shell /home/linuxbrew/.linuxbrew/bin/zsh"

# Work overlay: WORK_DIR/tmux.conf loads last, when the shell exported WORK_DIR.
# It can add a status bar dashboard by setting @setup_dashboard to its label
# and defining command-alias[108] as status-dashboard.
if-shell '[ -n "$WORK_DIR" ]' 'source-file -q "$WORK_DIR/tmux.conf"'
