# Render Codex's native terminal state and elapsed time in tmux window tabs.
# Loaded by ~/.tmux.conf; it may also be reloaded directly for visual iteration.

# Strip the shared repo suffix once, then classify and render every native state
# from that normalized title: alert pulse, busy spinner, or idle fallback.
set -g @codex_native_title '#{s/ [^ ]*$//:pane_title}'
set -g @codex_native_action '#{s/^\[ *([!.]) *\] Action Required \|$/\1/:#{E:@codex_native_title}}'
set -g @codex_native_busy '#{s/⠏/⡏/:#{s/⠇/⡇/:#{s/⠧/⣧/:#{s/⠦/⣦/:#{s/⠴/⣴/:#{s/⠼/⣼/:#{s/⠸/⢸/:#{s/⠹/⢹/:#{E:@codex_native_title}}}}}}}}}'
set -g @codex_native_state '#{?#{m/r:^\[ *[!.] *\] Action Required \|$,#{E:@codex_native_title}},#{E:@codex_native_action},#{?#{m/r:^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]$,#{E:@codex_native_title}},#{E:@codex_native_busy},💤}}'
set -g window-status-format '#[fg=#565f89]#I-#W#{P:#{?#{&&:#{m/r:^codex,#{pane_current_command}},#{pane_title}}, #[fg=#bb9af7]#[dim]#{E:@codex_native_state}#{?@codex_native_elapsed, #{@codex_native_elapsed},}#[nodim]#[fg=#565f89],}}'
set -g window-status-current-format '#[fg=#7aa2f7]#I-#W#{P:#{?#{&&:#{m/r:^codex,#{pane_current_command}},#{pane_title}}, #[fg=#bb9af7]#{E:@codex_native_state}#{?@codex_native_elapsed, #{@codex_native_elapsed},}#[fg=#7aa2f7],}}'

# One server-wide updater records state transitions from pane titles every 10s.
run-shell -b "$SETUP_DIR/dotfiles/.bin/tmux-codex-status start"
