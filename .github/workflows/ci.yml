name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every lint job installs these Ruff and ShellCheck versions, on macOS and Ubuntu
# alike, so lint results never depend on the runner. A work overlay's CI should
# pin the same versions.
env:
  RUFF_VERSION: "0.16.10"
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" |
            tar -xz -C /usr/local/bin gitleaks
      # Scan only the commits this push or pull request adds.
      - name: Scan new commits with gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            range="HEAD~1..HEAD"
          else
            range="$BASE_SHA..HEAD"
          fi
          gitleaks git --redact --no-banner --verbose --log-opts="$range"

  test-linux:
    name: Lint and test on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh tmux
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install rich==14.3.3 textual==8.0.1 "ruff==$RUFF_VERSION"
          echo "$RUNNER_TEMP/venv/bin" >>"$GITHUB_PATH"
      # ShellCheck comes from its release binary, not the runner's own copy.
      - name: Install ShellCheck
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/arm64/aarch64/')"
          name="shellcheck-v${SHELLCHECK_VERSION}"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${name}.${os}.${arch}.tar.xz" |
            tar -xJ -C "$RUNNER_TEMP/bin" --strip-components=1 "${name}/shellcheck"
          "$RUNNER_TEMP/bin/shellcheck" --version | grep -qx "version: ${SHELLCHECK_VERSION}"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Ubuntu's fzf is too old for fzf --zsh, so pinned release binaries are
      # installed under RUNNER_TEMP, like the secrets job's gitleaks.
      - name: Install fzf, Atuin and gitleaks
        env:
          FZF_VERSION: 0.74.4
          ATUIN_VERSION: 18.23.0
          GITLEAKS_VERSION: 8.30.1
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-linux_amd64.tar.gz" |
            tar -xz -C "$RUNNER_TEMP/bin" fzf
          curl -sSfL "https://github.com/atuinsh/atuin/releases/download/v${ATUIN_VERSION}/atuin-x86_64-unknown-linux-gnu.tar.gz" |
            tar -xz -C "$RUNNER_TEMP/bin" --strip-components=1 atuin-x86_64-unknown-linux-gnu/atuin
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" |
            tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # ./setup.sh --test skips lint rows when a linter is missing, and the
      # fzf, Atuin, gitleaks and tmux tests skip without their tool, so make sure
      # all are here. The runner image ships mikefarah yq v4,
      # which the Codex config tests need.
      - name: Check the test tools are installed
        run: |
          ruff --version
          shellcheck --version
          yq --version | grep -q mikefarah
          fzf --version
          atuin --version
          gitleaks version
          tmux -V
      - name: Run ./setup.sh --test
        env:
          NO_COLOR: "1"
        run: ./setup.sh --test

  test-macos:
    name: Test on macOS
    # Runs on pull requests and on pushes to main, so every commit on main is
    # tested on macOS as well as Ubuntu.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      # Ruff and ShellCheck are left out: the Ubuntu job lints, so the lint rows
      # are skipped here.
      - name: Install test dependencies
        run: |
          brew install yq fzf atuin gitleaks tmux
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install rich==14.3.3 textual==8.0.1
          echo "$RUNNER_TEMP/venv/bin" >>"$GITHUB_PATH"
      # The fzf, Atuin, gitleaks and tmux tests skip without their tool.
      - name: Check the test tools are installed
        run: |
          fzf --version
          atuin --version
          gitleaks version
          tmux -V
      # Swift compiles are most of the macOS run; keep them between runs. The
      # key changes with any Swift source, so a run restores the newest cache
      # and saves its own; the cache prunes itself to its size limit.
      - name: Restore the Swift compile cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/setup-swiftc-cache
          key: swiftc-${{ runner.os }}-${{ hashFiles('apps/**', 'tests/dotfiles/**', 'dotfiles/.bin/**') }}
          restore-keys: swiftc-${{ runner.os }}-
      - name: Run ./setup.sh --test
        env:
          NO_COLOR: "1"
        run: SETUP_SWIFTC_CACHE="$HOME/Library/Caches/setup-swiftc-cache" ./setup.sh --test
