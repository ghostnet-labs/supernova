# Opens a pull request when a GitHub Action used in .github/workflows has a newer version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Titles read "ci: bump ..." to match the PR title format.
    commit-message:
      prefix: ci
    # Minor and patch bumps share one PR that dependabot-auto-merge.yml merges once
    # CI passes; each major bump gets its own PR for review.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
